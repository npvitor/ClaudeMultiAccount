name: build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Unit tests
        run: dotnet test --project tests/ClaudeMultiAccount.Tests -c Release

      # The hosted runner is a throwaway, elevated VM: the right place for the tests that create a real
      # hidden Windows user, share folders with it, run steps as it and remove it again.
      - name: Admin integration tests
        env:
          CMA_ADMIN_TESTS: '1'
        run: dotnet test --project tests/ClaudeMultiAccount.Tests -c Release --no-build -- --filter-class ClaudeMultiAccount.Tests.AdminIntegrationTests

      - name: Publish single-file exe
        run: >
          dotnet publish src/ClaudeMultiAccount/ClaudeMultiAccount.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeMultiAccount-win-x64
          path: publish/ClaudeMultiAccount.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/ClaudeMultiAccount.exe
          generate_release_notes: true
